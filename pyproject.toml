[project]
name = "watchtower"
version = "0.1.0"
description = "Self-healing agent that attaches to European procurement portals"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "playwright==1.65.2",
  "selectolax>=0.3.21",
  "lxml>=5.3",
  "jsonpath-ng>=1.7",
  "dateparser>=1.2",
  "typesafe-sdk",
  "anthropic>=0.40",
  "openai>=1.55",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21"]
tracing = ["mlflow>=3.1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["watchtower*"]

[tool.setuptools.package-data]
watchtower = ["dashboard/templates/*.html", "dashboard/static/*", "lab/templates/*.html", "brain/prompts/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: hits real external APIs (opt-in with -m live)"]
addopts = "-m 'not live'"
